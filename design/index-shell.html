<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; worker-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<title>Paniere Delhaize — densità nutrizionale</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#2a78d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:light;
  --plane:#f9f9f7; --surface:#fcfcfb;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s1-soft:#cde2fb;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --plane:#0d0d0d; --surface:#1a1a19;
    --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s1-soft:#184f95;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#0d0d0d; --surface:#1a1a19;
  --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s1-soft:#184f95;
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--plane); color:var(--ink);
  line-height:1.5; font-size:15px;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 32px}
h1{font-size:1.15rem;font-weight:650;letter-spacing:-.01em}
h2{font-size:.95rem;font-weight:650;margin:22px 0 10px}
h2:first-of-type{margin-top:8px}
p{color:var(--ink2);font-size:.86rem}
.sub{color:var(--muted);font-size:.76rem;margin-top:2px}

/* header */
header{padding:14px 16px 10px;border-bottom:1px solid var(--grid);background:var(--surface)}
.hrow{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;
  font-size:.72rem;font-weight:650;letter-spacing:.02em;border:1.5px solid currentColor
}
.badge.draft{color:var(--crit)} .badge.beta{color:var(--serious)} .badge.validated{color:var(--good)}
.theme-btn{margin-left:auto;background:none;border:1px solid var(--ring);color:var(--ink2);
  border-radius:8px;padding:4px 9px;font-size:.75rem;cursor:pointer}

/* cards */
.card{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);
  padding:14px;margin-bottom:10px}
.note{border-left:3px solid var(--warn);background:var(--surface);
  border-radius:0 var(--r) var(--r) 0;padding:12px 14px;margin-bottom:12px}
.note strong{display:block;font-size:.82rem;margin-bottom:4px}
.note p{font-size:.8rem}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:12px}
.tile .v{font-size:1.5rem;font-weight:640;letter-spacing:-.02em;line-height:1.1}
.tile .k{font-size:.7rem;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.04em}
.tile .d{font-size:.72rem;color:var(--ink2);margin-top:3px}

/* meters */
.meter{margin-bottom:12px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.82rem}
.meter-top b{font-weight:600}
.meter-val{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:.8rem}
.track{height:8px;background:var(--grid);border-radius:4px;margin-top:5px;overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--s1)}
.meter .why{font-size:.72rem;color:var(--muted);margin-top:4px}

/* nutrient rows */
.nrow{padding:11px 0;border-bottom:1px solid var(--grid);cursor:pointer}
.nrow:last-child{border-bottom:none}
.nrow-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.nname{font-weight:550;font-size:.87rem}
.nval{font-variant-numeric:tabular-nums;font-size:.87rem;white-space:nowrap}
.nbar{position:relative;height:10px;background:var(--grid);border-radius:5px;margin-top:7px}
.nbar .f{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--s1)}
.nbar .ref{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--axis)}
.nrow.unscored .f{background:var(--axis);opacity:.55}
.nmeta{display:flex;gap:10px;flex-wrap:wrap;font-size:.72rem;color:var(--muted);margin-top:5px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;
  border:1px solid var(--ring);font-size:.68rem;color:var(--ink2)}
.chip.warn{color:var(--serious);border-color:currentColor}

/* sensitivity: 2 series -> legend required */
.legend{display:flex;gap:14px;font-size:.74rem;color:var(--ink2);margin-bottom:10px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px}
.srow{padding:9px 0;border-bottom:1px solid var(--grid)}
.srow:last-child{border-bottom:none}
.sname{font-size:.82rem;font-weight:550;display:flex;justify-content:space-between;gap:8px}
.sdelta{font-variant-numeric:tabular-nums;color:var(--serious);font-weight:600}
.sbars{margin-top:6px}
.sbar{height:7px;border-radius:4px;margin-bottom:2px;min-width:2px}

/* lists */
.item{padding:11px 0;border-bottom:1px solid var(--grid)}
.item:last-child{border-bottom:none}
.item-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item-n{font-weight:550;font-size:.84rem;word-break:break-word}
.item-p{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--ink2);white-space:nowrap}
.item-d{font-size:.76rem;color:var(--muted);margin-top:3px}
.reason{font-size:.78rem;color:var(--ink2);margin-top:4px}

/* filters */
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pill{padding:5px 13px;border-radius:999px;border:1.5px solid var(--ring);background:transparent;
  color:var(--ink2);font-size:.78rem;cursor:pointer;font-family:inherit}
.pill[aria-pressed="true"]{background:var(--s1);color:#fff;border-color:var(--s1)}
input[type=search]{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--ring);
  background:var(--surface);color:var(--ink);font-size:.85rem;font-family:inherit;margin-bottom:10px}

/* table view (desktop) */
.tbl{display:none;width:100%;border-collapse:collapse;font-size:.8rem}
@media(min-width:760px){
  .tbl{display:table}
  .tbl.on ~ .cards{display:none}
  .tbl th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;
    color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--axis)}
  .tbl td{padding:7px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
  .tbl td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
}

/* bottom nav (mobile) / top tabs (desktop) */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);
  border-top:1px solid var(--grid);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:var(--muted);font-family:inherit;
  font-size:.65rem;padding:8px 2px 9px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:3px;line-height:1.15}
nav button span.i{font-size:1.05rem;line-height:1}
nav button[aria-selected="true"]{color:var(--s1);font-weight:600}
@media(min-width:760px){
  body{padding-bottom:24px}
  nav{position:sticky;top:0;bottom:auto;border-top:none;border-bottom:1px solid var(--grid);
    max-width:900px;margin:0 auto;padding:0 16px}
  nav button{flex:0 0 auto;flex-direction:row;gap:7px;font-size:.82rem;padding:12px 16px;
    border-bottom:2px solid transparent}
  nav button[aria-selected="true"]{border-bottom-color:var(--s1)}
  nav button span.i{font-size:.95rem}
}
[hidden]{display:none!important}
.empty{color:var(--muted);font-size:.82rem;padding:18px 0;text-align:center}
footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--grid);
  font-size:.72rem;color:var(--muted)}
</style>
</head>
<body>
<header><div class="hrow">
  <h1>Paniere Delhaize</h1>
  <span class="badge draft">● Draft</span>
  <button class="theme-btn" id="theme">Tema</button>
</div></header>

<nav role="tablist">
  <button data-tab="overview"  aria-selected="true"><span class="i">◎</span>Panoramica</button>
  <button data-tab="nutrients" aria-selected="false"><span class="i">▤</span>Nutrienti</button>
  <button data-tab="quality"   aria-selected="false"><span class="i">⚑</span>Qualità</button>
  <button data-tab="items"     aria-selected="false"><span class="i">≡</span>Acquisti</button>
</nav>

<div class="wrap"><main id="main"></main>
<footer>
  Normalizzato a 2500 kcal · riferimenti UE Reg. 1169/2011 Allegato XIII
  riscalati · generato da <code>skills.rebuild</code> su
  88 scontrini.
  Valori nutrizionali per-100&nbsp;g ereditati dallo snapshot pyfooda legacy e non ancora
  sostituiti con CIQUAL/FoodData Central.
</footer></div>

<!-- The real build inlines the full dataset here (~800 KB).
     For design work it is loaded from the attached sample instead. -->
<script>
fetch('./sample-report.json').then(r => r.json()).then(d => {
  window.__REPORT__ = d;
  const s = document.createElement('script');
  s.textContent = document.getElementById('app-src').textContent;
  document.body.appendChild(s);
});
</script>
<script type="text/plain" id="app-src">
const D = window.__REPORT__;

const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v, d = 0) => v == null ? '—'
  : Number(v).toLocaleString('it-IT', {minimumFractionDigits: d, maximumFractionDigits: d});
const eur = v => v == null ? '—' : '€' + num(v, 2);

const NL = n => (D.nutrient_labels && D.nutrient_labels[n]) || n;

const STATE_LABEL = {
  usable: 'Conteggiato',
  quantity_unknown: 'Quantità non sull’etichetta',
  volume_no_density: 'Volume senza densità ufficiale',
  not_food_or_unmatched: 'Non alimentare o non abbinato',
  quarantined: 'Abbinamento in quarantena',
  no_food_record: 'Record alimentare mancante',
  receipt_metadata: 'Riga di scontrino (totale/pagamento)'
};

/* ── Panoramica ─────────────────────────────────────────────────────────── */
function viewOverview() {
  const c = D.coverage, r = D.receipts;
  const tiers = [
    ['Righe prodotto abbinate', c.pct_matched,
     `${num(c.rows_food_matched)} di ${num(c.rows_product_lines)} righe`],
    ['Quantità letta in etichetta', c.pct_quantity_of_matched,
     `${num(c.rows_usable)} delle ${num(c.rows_food_matched)} righe abbinate`],
    ['Righe utilizzabili nel calcolo', c.pct_usable_of_all,
     `con stime legacy salirebbe a ${c.pct_usable_of_all_with_estimates}%`],
    ['Spesa rappresentata', c.pct_spend_covered,
     `${eur(c.spend_usable_eur)} su ${eur(c.spend_total_eur)}`]
  ];

  return `
  <div class="note">
    <strong>⚠ Cosa misura questo report</strong>
    <p>${esc(D.disclaimer)}</p>
  </div>

  <div class="tiles">
    <div class="tile"><div class="v">${num(r.receipts_in_analysis)}</div>
      <div class="k">Scontrini analizzati</div>
      <div class="d">su ${num(r.images_unique)} unici (${num(r.images_total)} file)</div></div>
    <div class="tile"><div class="v">${num(r.images_without_ocr.length)}</div>
      <div class="k">Mai letti</div>
      <div class="d">OCR non ancora eseguito</div></div>
    <div class="tile"><div class="v">${num(r.duplicate_pairs)}</div>
      <div class="k">Doppioni rimossi</div>
      <div class="d">immagini identiche al byte</div></div>
    <div class="tile"><div class="v">${c.pct_usable_of_all}%</div>
      <div class="k">Copertura reale</div>
      <div class="d">righe che entrano nei totali</div></div>
  </div>

  <h2>Perché lo stato è “${esc(D.status)}”</h2>
  <div class="card">
    ${D.status_reasons.map(x => `<p style="margin-bottom:6px">• ${esc(x)}</p>`).join('')}
  </div>

  <h2>Copertura, passaggio per passaggio</h2>
  <div class="card">
    ${tiers.map(([label, pct, why]) => `
      <div class="meter">
        <div class="meter-top"><b>${esc(label)}</b><span class="meter-val">${pct}%</span></div>
        <div class="track"><div class="fill" style="width:${Math.min(100, pct)}%"></div></div>
        <div class="why">${esc(why)}</div>
      </div>`).join('')}
  </div>

  <h2>Periodo coperto</h2>
  <div class="card">
    <p>Dal <b>${esc(r.date_first)}</b> al <b>${esc(r.date_last)}</b>.
    ${r.images_without_ocr.length} immagini successive non sono mai state elaborate,
    quindi il periodo più recente non è rappresentato.</p>
  </div>`;
}

/* ── Nutrienti ──────────────────────────────────────────────────────────── */
let nutYear = 'all';
function viewNutrients() {
  const src = nutYear === 'all' ? D.nutrients : (D.nutrients_by_year[nutYear] || {});
  const pills = ['all', ...D.years].map(y => `
    <button class="pill" aria-pressed="${nutYear === y}" data-year="${esc(y)}">
      ${y === 'all' ? 'Tutti gli anni' : esc(y)}</button>`).join('');

  const rows = D.nutrient_order.map(n => {
    const d = src[n];
    if (!d) return '';
    const unit = (D.units[n] || '').toLowerCase();
    const pct = d.pct_of_reference;
    const width = pct == null ? 0 : Math.min(100, pct / 2);   // 200% = full track
    const refX = 50;                                           // 100% marker
    const lowCov = d.coverage_pct < 80;
    const noRef = d.reference == null;
    return `
    <div class="nrow ${(lowCov || noRef) ? 'unscored' : ''}" data-nut="${esc(n)}">
      <div class="nrow-top">
        <span class="nname">${esc(NL(n))}</span>
        <span class="nval">${num(d.value, 1)} ${esc(unit)}</span>
      </div>
      ${noRef ? '' : `
      <div class="nbar">
        <div class="f" style="width:${width}%"></div>
        <div class="ref" style="left:${refX}%"></div>
      </div>`}
      <div class="nmeta">
        <span class="chip ${lowCov ? 'warn' : ''}">
          ${lowCov ? '⚠ ' : ''}copertura ${d.coverage_pct}%</span>
        ${noRef
          ? '<span class="chip">nessun riferimento UE</span>'
          : (lowCov
              ? '<span class="chip warn">⚠ non confrontabile</span>'
              : `<span class="chip">${pct}% del riferimento</span>`)}
        ${d.dominated_by_single_item
          ? `<span class="chip warn">⚠ ${d.top_item_share_pct}% da un solo prodotto</span>` : ''}
      </div>
    </div>`;
  }).join('');

  return `
    <div class="pills" id="year-pills">${pills}</div>
    <div class="note">
      <strong>Come leggere questi numeri</strong>
      <p>Valori per <b>2.500 kcal di spesa alimentare</b>. La tacca verticale è il
      riferimento UE (Reg. 1169/2011, Allegato XIII) riscalato a 2.500 kcal, e la barra
      arriva a fondo scala al 200%. È un confronto di <b>densità nutrizionale</b>, non
      una valutazione di adeguatezza: nessun valore è “giusto” o “sbagliato”, e per
      questo non ci sono colori rosso/verde. Sotto l’80% di copertura il valore resta
      grigio e non viene confrontato.</p>
    </div>
    <div class="card">${rows || '<div class="empty">Nessun dato per il periodo.</div>'}</div>`;
}

/* ── Qualità dei dati ───────────────────────────────────────────────────── */
function viewQuality() {
  const r = D.receipts, c = D.coverage;
  const sens = D.sensitivity_estimated_quantities.slice(0, 8);

  // Each row is a PAIRED comparison, so it is scaled against its own maximum.
  // A shared cross-nutrient scale would flatten every micronutrient to nothing.
  const sensRows = sens.map(s => {
    const m = Math.max(s.observed_only, s.with_estimates) || 1;
    const unit = (D.units[s.nutrient] || '').toLowerCase();
    return `
    <div class="srow">
      <div class="sname"><span>${esc(NL(s.nutrient))}</span>
        <span class="sdelta">${s.delta_pct > 0 ? '+' : ''}${s.delta_pct}%</span></div>
      <div class="sbars">
        <div class="sbar" style="width:${s.observed_only / m * 100}%;background:var(--s1)"></div>
        <div class="sbar" style="width:${s.with_estimates / m * 100}%;background:var(--s2)"></div>
      </div>
      <div class="item-d">${num(s.observed_only, 1)} → ${num(s.with_estimates, 1)} ${esc(unit)}</div>
    </div>`;
  }).join('');

  const quar = D.quarantined.map(q => `
    <div class="item">
      <div class="item-h"><span class="item-n">${esc(q.product_name)}</span>
        <span class="item-p">${q.rows}× · ${eur(q.spend)}</span></div>
      <div class="reason">${esc(q.reason)}</div>
    </div>`).join('');

  const review = D.needs_review.length ? D.needs_review.map(x => `
    <div class="item"><div class="item-h">
      <span class="item-n">${esc(x.mapping)}</span>
      <span class="item-p">${x.rows}×</span></div>
      <div class="item-d">Prodotto composto abbinato a un singolo ingrediente.</div>
    </div>`).join('') : '<div class="empty">Nessuno.</div>';

  return `
  <h2>Scontrini</h2>
  <div class="card">
    <div class="item"><div class="item-h"><span class="item-n">Immagini totali</span>
      <span class="item-p">${num(r.images_total)}</span></div></div>
    <div class="item"><div class="item-h"><span class="item-n">Uniche dopo deduplica</span>
      <span class="item-p">${num(r.images_unique)}</span></div>
      <div class="item-d">${r.duplicate_pairs} coppie identiche al byte, contate una volta sola</div></div>
    <div class="item"><div class="item-h"><span class="item-n">Mai passate all’OCR</span>
      <span class="item-p">${num(r.images_without_ocr.length)}</span></div>
      <div class="item-d">${esc(r.images_without_ocr.slice(0, 6).join(', '))}${r.images_without_ocr.length > 6 ? ' …' : ''}</div></div>
    <div class="item"><div class="item-h"><span class="item-n">CSV vuoti (OCR fallito)</span>
      <span class="item-p">${num(r.ocr_empty.length)}</span></div>
      <div class="item-d">${esc(r.ocr_empty.join(', '))}</div></div>
    <div class="item"><div class="item-h"><span class="item-n">Righe di scontrino escluse</span>
      <span class="item-p">${num(c.rows_receipt_metadata)}</span></div>
      <div class="item-d">Totali, punti fedeltà e pagamenti: non sono prodotti</div></div>
  </div>

  <h2>Quanto dipendono i numeri dalle stime</h2>
  <div class="card">
    <p style="margin-bottom:10px">Confronto fra le quantità <b>lette sull’etichetta</b> e
    quelle che la vecchia pipeline <b>stimava</b> (peso tipico, prezzo, valore inserito a mano).
    Uno scarto grande significa che il numero era retto da ipotesi, non da dati.</p>
    <div class="legend">
      <span><i style="background:var(--s1)"></i>Solo osservato</span>
      <span><i style="background:var(--s2)"></i>Con stime legacy</span>
    </div>
    ${sensRows}
  </div>

  <h2>Abbinamenti in quarantena <span class="sub">(${D.quarantined.length})</span></h2>
  <div class="card">${quar || '<div class="empty">Nessuno.</div>'}</div>

  <h2>Da rivedere <span class="sub">(${D.needs_review.length})</span></h2>
  <div class="card">${review}</div>`;
}

/* ── Acquisti ───────────────────────────────────────────────────────────── */
let filter = 'all', query = '';
function viewItems() {
  const f = D.items.filter(i => {
    if (filter === 'usable' && i.state !== 'usable') return false;
    if (filter === 'excluded' && i.state === 'usable') return false;
    if (query && !(i.product_name + ' ' + (i.food || '')).toLowerCase().includes(query)) return false;
    return true;
  });
  const shown = f.slice(0, 300);

  const cards = shown.map(i => {
    const q = i.qty_amount != null ? `${num(i.qty_amount)} ${esc(i.qty_unit)}`
      : (i.declared_g ? `~${num(i.declared_g)} g (stima)` : 'sconosciuta');
    return `
    <div class="item">
      <div class="item-h"><span class="item-n">${esc(i.product_name)}</span>
        <span class="item-p">${eur(i.price)}</span></div>
      <div class="item-d">${esc(i.date)} · ${i.food ? esc(i.food) : '<i>non abbinato</i>'} · ${q}</div>
      <div class="item-d">${esc(STATE_LABEL[i.state] || i.state)}</div>
    </div>`;
  }).join('');

  const rows = shown.map(i => `
    <tr><td>${esc(i.date)}</td><td>${esc(i.product_name)}</td>
      <td>${i.food ? esc(i.food) : '—'}</td>
      <td class="num">${i.qty_amount != null ? num(i.qty_amount) + ' ' + esc(i.qty_unit)
        : (i.declared_g ? '~' + num(i.declared_g) + ' g' : '—')}</td>
      <td class="num">${eur(i.price)}</td>
      <td>${esc(STATE_LABEL[i.state] || i.state)}</td></tr>`).join('');

  return `
    <input type="search" id="q" placeholder="Cerca un prodotto…" value="${esc(query)}">
    <div class="pills" id="item-pills">
      <button class="pill" aria-pressed="${filter === 'all'}" data-f="all">Tutti</button>
      <button class="pill" aria-pressed="${filter === 'usable'}" data-f="usable">Conteggiati</button>
      <button class="pill" aria-pressed="${filter === 'excluded'}" data-f="excluded">Esclusi</button>
    </div>
    <p class="sub" style="margin-bottom:10px">${num(f.length)} righe${f.length > 300 ? ' — mostrate le prime 300' : ''}</p>
    <table class="tbl on"><thead><tr><th>Data</th><th>Prodotto</th><th>Abbinato a</th>
      <th class="num">Quantità</th><th class="num">Prezzo</th><th>Stato</th></tr></thead>
      <tbody>${rows}</tbody></table>
    <div class="cards card">${cards || '<div class="empty">Nessun risultato.</div>'}</div>`;
}

/* ── Router ─────────────────────────────────────────────────────────────── */
const VIEWS = {overview: viewOverview, nutrients: viewNutrients,
               quality: viewQuality, items: viewItems};
const hashTab = () => (location.hash || '').replace('#', '');
let tab = VIEWS[hashTab()] ? hashTab() : 'overview';
addEventListener('hashchange', () => {
  const t = hashTab();
  if (VIEWS[t] && t !== tab) { tab = t; render(); }
});

function render() {
  document.getElementById('main').innerHTML = VIEWS[tab]();
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  wire();
  window.scrollTo(0, 0);
}

function wire() {
  const yp = document.getElementById('year-pills');
  if (yp) yp.onclick = e => {
    const b = e.target.closest('[data-year]'); if (!b) return;
    nutYear = b.dataset.year; render();
  };
  const ip = document.getElementById('item-pills');
  if (ip) ip.onclick = e => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    filter = b.dataset.f; render();
  };
  const q = document.getElementById('q');
  if (q) q.oninput = e => {
    query = e.target.value.toLowerCase();
    const pos = e.target.selectionStart;
    render();
    const nq = document.getElementById('q');
    nq.focus(); nq.setSelectionRange(pos, pos);
  };
}

document.querySelector('nav').onclick = e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.dataset.tab;
  if (hashTab() !== tab) history.replaceState(null, '', '#' + tab);
  render();
};

document.getElementById('theme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
};

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
